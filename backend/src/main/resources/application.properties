spring.application.name=backend
server.port=${PORT:8080}
server.forward-headers-strategy=native


# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Actuator
management.endpoints.web.exposure.include=health,info 

# CORS
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173,http://localhost:5174}
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiry-ms=86400000
app.jwt.refresh-expiry-ms=604800000

spring.config.import=optional:file:.env[.properties]

app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Cloudinary (values environment variables se aayengi)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.password=${REDIS_PASSWORD:gQAAAAAAAf4EAAIgcDFmYTA3MTlmN2NiMWE0NjcyYjlmN2M5ZjVhYTI2ZDU0ZA}
spring.data.redis.timeout=2s

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB